    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Manrope:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-noir: #0c0a09; /* stone-950 */
        --text-gold: #d6bda0;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-noir);
        color: #e7e5e4; /* stone-200 */
        font-family: 'Manrope', sans-serif;
        overflow-x: hidden;
        
        /* Hide Scrollbar Standard & Firefox */
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      
      /* Hide Scrollbar Chrome/Safari/Webkit */
      body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      /* Selection Color */
      ::selection {
        background: #d6bda0; /* Goldish */
        color: #0c0a09;
      }

      /* Utility classes for fonts */
      .font-display {
        font-family: 'Playfair Display', serif;
      }
      .font-cinzel {
        font-family: 'Cinzel', serif;
      }
      .font-body {
        font-family: 'Manrope', sans-serif;
      }
      
      /* Utility for hiding scrollbar in specific containers if needed */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
